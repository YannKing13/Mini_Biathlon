<script>
'use strict';
(() => {
const $ = id => document.getElementById(id);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const mix=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>{t=Math.max(0,Math.round(t));return Math.floor(t/3600)?`${Math.floor(t/3600)}:${String(Math.floor(t/60)%60).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`:`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`};
const NATIONS=[['FRA','🇫🇷','France','#2673c8'],['NOR','🇳🇴','Norvège','#e84553'],['SWE','🇸🇪','Suède','#f7c63c'],['GER','🇩🇪','Allemagne','#e4a842'],['ITA','🇮🇹','Italie','#21aa78'],['FIN','🇫🇮','Finlande','#82d5ee'],['SUI','🇨🇭','Suisse','#ec5656'],['AUT','🇦🇹','Autriche','#ef5854'],['CZE','🇨🇿','Tchéquie','#347bd5'],['USA','🇺🇸','États-Unis','#e96b55'],['POL','🇵🇱','Pologne','#f26482'],['SLO','🇸🇮','Slovénie','#49b68b']];
const MEN=[['Alexis','Maël','Noé','Théo','Hugo'],['Eirik','Sander','Magnus','Jonas','Henrik'],['Oskar','Anton','Elias','Erik','Lukas'],['Felix','Moritz','Lennart','Timo','Ben'],['Luca','Marco','Elia','Davide','Andrea'],['Aarni','Jari','Mika','Eetu','Otto'],['Noah','Jan','Léo','Dario','Nils'],['Jakob','Florian','David','Paul','Simon'],['Matej','Jakub','Petr','Jan','Martin'],['Logan','Tyler','Jack','Ethan','Ryan'],['Jan','Marek','Filip','Adam','Piotr'],['Luka','Miha','Rok','Jure','Tim']];
const WOMEN=[['Camille','Léa','Anaïs','Manon','Lou'],['Ingrid','Kari','Nora','Marte','Signe'],['Elin','Ida','Linn','Sofia','Emma'],['Lena','Frida','Laura','Mia','Marlene'],['Giulia','Lisa','Sara','Elena','Marta'],['Aino','Ella','Sanni','Iida','Veera'],['Lina','Nina','Sina','Alina','Mara'],['Anna','Lena','Theresa','Julia','Eva'],['Tereza','Lucie','Petra','Jana','Eva'],['Taylor','Megan','Kate','Emily','Ava'],['Ola','Kaja','Zofia','Maja','Iga'],['Nika','Eva','Ana','Lara','Sara']];
const LAST=['Martin','Berg','Andersson','Keller','Rossi','Korhonen','Meier','Huber','Novák','Miller','Kowalski','Kovač'];
const eventDefs={
 sprint:{name:'Sprint',distM:10,distF:7.5,shots:'PS',kind:'interval',field:60,penalty:150,discipline:'Sprint',sub:'Départs échelonnés • 2 tirs'},
 pursuit:{name:'Poursuite',distM:12.5,distF:10,shots:'PPSS',kind:'pursuit',field:60,penalty:150,discipline:'Poursuite',sub:'Écarts issus du sprint • 4 tirs'},
 individual:{name:'Individuel',distM:20,distF:15,shots:'PSPS',kind:'interval',field:60,timePenalty:60,discipline:'Individuel',sub:'1 minute par cible manquée'},
 short:{name:'Individuel court',distM:15,distF:12.5,shots:'PSPS',kind:'interval',field:60,timePenalty:45,discipline:'Individuel',sub:'45 secondes par cible manquée'},
 mass:{name:'Mass start',distM:15,distF:12.5,shots:'PPSS',kind:'mass',field:30,penalty:150,discipline:'Mass start',sub:'30 biathlètes • 4 tirs'},
 supersprint:{name:'Super sprint',distM:7.5,distF:7.5,shots:'PPSS',kind:'supersprint',field:30,penalty:75,discipline:'Super sprint',sub:'Qualification simulée • finale à 30'},
 mass60:{name:'Mass start 60',distM:15,distF:12,shots:'PPSS',kind:'mass60',field:60,penalty:150,discipline:'Mass start',sub:'60 concurrents • 6 boucles'},
 relay:{name:'Relais',kind:'team',legs:4,shots:'PS',penalty:150,discipline:'Relais',field:12,sub:'4 athlètes • 3 balles de pioche'},
 mixed:{name:'Relais mixte',kind:'team',legs:4,shots:'PS',penalty:150,discipline:'Relais mixte',field:12,sub:'2 femmes + 2 hommes • 3 pioches'},
 single:{name:'Relais mixte simple',kind:'team',legs:4,shots:'PS',penalty:75,discipline:'Relais mixte simple',field:12,sub:'Duo alterné • pénalité 75 m'}
};
const CALENDAR=[['sprint','ÖSTERSUND','Suède'],['pursuit','ÖSTERSUND','Suède'],['individual','HOCHFILZEN','Autriche'],['relay','HOCHFILZEN','Autriche'],['mass','LE GRAND-BORNAND','France'],['mixed','LE GRAND-BORNAND','France'],['short','RUHPOLDING','Allemagne'],['sprint','RUHPOLDING','Allemagne'],['pursuit','RUHPOLDING','Allemagne'],['single','ANTHOLZ','Italie'],['supersprint','ANTHOLZ','Italie'],['mass60','OSLO-HOLMENKOLLEN','Norvège']];
const SCORE=[90,75,65,55,50,45,40,36,34,31,...Array.from({length:30},(_,i)=>30-i)];
const SPECIAL_SCORE=[90,75,65,55,50,45,40,36,34,31,30,29,28,27,26,25,24,23,22,21,20,18,16,14,12,10,8,6,4,2];
const randName=(nation,sex,k)=>`${(sex==='F'?WOMEN:MEN)[nation][k]} ${LAST[nation]}`;
const ROSTER=[];for(let n=0;n<12;n++)for(const sex of ['M','F'])for(let k=0;k<5;k++){const seed=n*37+k*23+(sex==='F'?17:0);ROSTER.push({id:`${sex}${n}_${k}`,n,sex,k,name:randName(n,sex,k),ski:clamp(68+((seed*7)%28),60,98),shoot:clamp(66+((seed*11)%30),60,96),endurance:clamp(67+((seed*13)%30),60,96)})}
const byId=id=>ROSTER.find(a=>a.id===id);
const getAthletes=(sex)=>ROSTER.filter(x=>x.sex===sex);
const state={screen:'home',tab:'home',sex:'M',nation:0,athleteId:'M0_0',quick:'sprint',stage:0,results:[],seasonActive:false,sound:true,difficulty:'normal'};
const storage='mini_biathlon_championship_v1';try{let s=JSON.parse(localStorage.getItem(storage)||'null');if(s)Object.assign(state,s)}catch(e){}
function save(){try{localStorage.setItem(storage,JSON.stringify({sex:state.sex,nation:state.nation,athleteId:state.athleteId,stage:state.stage,results:state.results,seasonActive:state.seasonActive,quick:state.quick,sound:state.sound,difficulty:state.difficulty}))}catch(e){}}
const nation=n=>NATIONS[n];const player=()=>byId(state.athleteId)||getAthletes(state.sex).find(a=>a.n===state.nation)||getAthletes(state.sex)[0];
function fullName(a){return a.name}
function pts(pos,type=''){return (['mass','mass60','supersprint'].includes(type)?SPECIAL_SCORE:SCORE)[pos-1]||0}
function standingsFor(discipline){const scores={};for(const a of getAthletes(state.sex))scores[a.id]={id:a.id,name:a.name,n:a.n,pts:0,starts:0,wins:0};for(const r of state.results){if(r.team)continue;if(discipline!=='Général'&&r.discipline!==discipline)continue;for(const row of r.rows||[]){let t=scores[row.id];if(t){t.pts+=pts(row.rank,r.type);t.starts++;if(row.rank===1)t.wins++}}}return Object.values(scores).filter(x=>x.starts>0).sort((a,b)=>b.pts-a.pts||b.wins-a.wins)}
function teamStandings(filter){const scores={};for(let n=0;n<12;n++)scores[n]={n,pts:0,starts:0,wins:0};for(const r of state.results){if(!r.team)continue;if(filter!=='Équipes'&&r.discipline!==filter)continue;for(const row of r.rows||[]){let t=scores[row.n];if(t){t.pts+=pts(row.rank,r.type);t.starts++;if(row.rank===1)t.wins++}}}return Object.values(scores).filter(x=>x.starts>0).sort((a,b)=>b.pts-a.pts||b.wins-a.wins)}

function render(){if(!race)return;ctx.save();ctx.clearRect(0,0,W,H);if(race.mode==='shoot')drawScope();else drawSki();ctx.restore()}
function tick(now){requestAnimationFrame(tick);let dt=clamp((now-timePrev)/1000,0,.06);timePrev=now;if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('toast').classList.add('hidden')}if(!race)return;
