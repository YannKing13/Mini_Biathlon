function makeCalendar(year){const base=BASE_CALENDAR.map(x=>x.slice());if(olympicYear(year)){const target=year+1,loc=target===2030?'LE GRAND-BORNAND':target===2034?'SOLDIER HOLLOW':'SITE OLYMPIQUE',country=target===2030?'France':target===2034?'États-Unis':'À déterminer';base.splice(6,0,...OLYMPIC_EVENTS.map(x=>[x[0],loc,country,x[3],x[4]]));}return base;}
let CALENDAR=makeCalendar(2026);
const SCORE=[90,75,65,55,50,45,40,36,34,31,...Array.from({length:30},(_,i)=>30-i)];

function initialRoster(){const all=[];for(let n=0;n<12;n++)for(const sex of ['M','F'])for(let k=0;k<5;k++){const seed=n*37+k*23+(sex==='F'?17:0);all.push({id:`${sex}${n}_${k}`,n,sex,k,name:randName(n,sex,k),ski:clamp(68+((seed*7)%28),60,98),shoot:clamp(66+((seed*11)%30),60,96),endurance:clamp(67+((seed*13)%30),60,96),age:20+((n*7+k*4+(sex==='F'?3:0))%17),potential:clamp(75+(seed*5)%24,72,99),retired:false,rookieYear:2026,careerWins:0});}return all;}
const state={screen:'menu',tab:'home',sex:'M',nation:0,athleteId:'M0_0',quick:'sprint',stage:0,results:[],seasonActive:false,sound:true,difficulty:'normal',year:2026,history:[],retired:[],news:[],nextRookie:0,relaySelections:{},medalArchive:[]};
const storage='mini_biathlon_championship_v1';
try{const saved=JSON.parse(localStorage.getItem(storage)||'null');if(saved)Object.assign(state,saved);}catch(e){}
if(!Number.isInteger(state.year)||state.year<2026)state.year=2026;
if(!Array.isArray(state.history))state.history=[];

if(!state.relaySelections||typeof state.relaySelections!=='object')state.relaySelections={};

for(const a of ROSTER){if(!Number.isFinite(a.age))a.age=20+((a.n*7+a.k*4+(a.sex==='F'?3:0))%17);if(!Number.isFinite(a.potential))a.potential=86;if(!Number.isFinite(a.careerWins))a.careerWins=0;}
CALENDAR=makeCalendar(state.year);state.stage=clamp(state.stage||0,0,CALENDAR.length);
const byId=id=>ROSTER.find(a=>a.id===id);
const getAthletes=sex=>ROSTER.filter(a=>a.sex===sex&&!a.retired);
const nation=n=>NATIONS[n];
function player(sex=state.sex){const chosen=byId(state.athleteId);if(chosen&&!chosen.retired&&chosen.sex===sex&&chosen.n===state.nation)return chosen;return getAthletes(sex).filter(a=>a.n===state.nation).sort((a,b)=>b.ski+b.shoot-a.ski-a.shoot)[0]||getAthletes(sex)[0];}
if(!byId(state.athleteId)||byId(state.athleteId).retired){state.athleteId=player().id;}

function eventAt(i=state.stage){const e=CALENDAR[i];return e?{type:e[0],venue:e[1],country:e[2],olympic:e[3]==='JO',sex:e[4]==='mixte'?'mixte':e[4]||null}:null;}
function sexForEvent(i=state.stage){const ev=eventAt(i);return ev?.sex&&ev.sex!=='mixte'?ev.sex:state.sex;}
function raceSex(){return race?.sex||state.sex;}
function seasonLabel(y=state.year){return `${y}–${String((y+1)%100).padStart(2,'0')}`;}
function sportLabel(sex){return sex==='M'?'Hommes':sex==='F'?'Femmes':'Mixte';}
function rosterByNation(n,sex){return getAthletes(sex).filter(a=>a.n===n).sort((a,b)=>((b.ski+b.shoot+b.endurance)/3)-((a.ski+a.shoot+a.endurance)/3));}
function olympicResults(){return state.results.filter(r=>r.olympic);}
function olympicMedals(){const totals=Array.from({length:12},(_,n)=>({n,gold:0,silver:0,bronze:0}));for(const r of olympicResults()){for(const [i,row] of r.rows.slice(0,3).entries())totals[row.n][['gold','silver','bronze'][i]]++;}return totals.sort((a,b)=>b.gold-a.gold||b.silver-a.silver||b.bronze-a.bronze);}
function medalText(n){const m=olympicMedals().find(x=>x.n===n);return `🥇 ${m.gold} · 🥈 ${m.silver} · 🥉 ${m.bronze}`;}
function teamKey(type,sex){const key=type==='relay'?`relay${sex}`:type;return `${state.nation}:${key}`;}
function legSexes(type,sex){if(type==='relay')return [sex,sex,sex,sex];if(type==='mixed')return ['M','M','F','F'];return ['F','M','F','M'];}
function lineupFor(n,type,sex,custom=n===state.nation){const order=legSexes(type,sex),key=teamKey(type,sex),saved=custom?state.relaySelections[key]||[]:[];const used={M:new Set(),F:new Set()};return order.map((s,i)=>{const pool=rosterByNation(n,s),prior=byId(saved[i]);if(type==='single'&&i>=2)return i===2?used.F.first:used.M.first;let athlete=prior&&prior.sex===s&&prior.n===n&&!prior.retired&&!used[s].has(prior.id)?prior:pool.find(a=>!used[s].has(a.id))||pool[0];if(athlete){used[s].add(athlete.id);used[s].first=used[s].first||athlete;}return athlete;});}
function saveLineup(type,sex,ids){const keys=legSexes(type,sex),seen=new Set();for(let i=0;i<(type==='single'?2:4);i++){const ath=byId(ids[i]);if(!ath||ath.retired||ath.n!==state.nation||ath.sex!==keys[i]||seen.has(ath.id))return false;seen.add(ath.id);}const arr=type==='single'?[ids[0],ids[1],ids[0],ids[1]]:ids.slice(0,4);state.relaySelections[teamKey(type,sex)]=arr;save();return true;}

 const topTeams=teamStandings('Équipes'), medals=olympicMedals();const summary={year:state.year,label:seasonLabel(),events:state.results.length,champions,teams:topTeams.slice(0,3).map(x=>({...x})),personal:state.results.filter(r=>r.userRank).map(r=>({name:r.name,venue:r.venue,rank:r.userRank,olympic:!!r.olympic,sex:r.sex})),medals:olympicYear(state.year)?medals:[],olympic:olympicYear(state.year)};state.history.push(summary);}

 state.stage=0;state.results=[];state.seasonActive=false;state.year++;CALENDAR=makeCalendar(state.year);state.news=[...arrivals.filter(a=>a.n===state.nation).map(a=>`✨ Nouvelle recrue : ${a.name} (${a.age} ans) · ${sportLabel(a.sex)}`),...departures.filter(a=>a.n===state.nation).map(a=>`👋 Retraite : ${a.name} (${a.age} ans)`)];
 if(!state.news.length)state.news=[`🔁 ${arrivals.length} jeunes talents intègrent le circuit, ${departures.length} sportifs prennent leur retraite.`];

function fullName(a){return a.name}
function pts(pos,type=''){return (['mass','mass60','supersprint'].includes(type)?SPECIAL_SCORE:SCORE)[pos-1]||0}
function standingsFor(discipline,sex=state.sex){const scores={};for(const a of getAthletes(sex))scores[a.id]={id:a.id,name:a.name,n:a.n,pts:0,starts:0,wins:0};for(const r of state.results){if(r.team||r.olympic||r.sex&&r.sex!==sex)continue;if(discipline!=='Général'&&r.discipline!==discipline)continue;for(const row of r.rows||[]){let t=scores[row.id];if(t){t.pts+=pts(row.rank,r.type);t.starts++;if(row.rank===1)t.wins++}}}return Object.values(scores).filter(x=>x.starts>0).sort((a,b)=>b.pts-a.pts||b.wins-a.wins);}
function teamStandings(filter){const scores={};for(let n=0;n<12;n++)scores[n]={n,pts:0,starts:0,wins:0};for(const r of state.results){if(!r.team||r.olympic)continue;if(filter!=='Équipes'&&r.discipline!==filter)continue;for(const row of r.rows||[]){let t=scores[row.n];if(t){t.pts+=pts(row.rank,r.type);t.starts++;if(row.rank===1)t.wins++}}}return Object.values(scores).filter(x=>x.starts>0).sort((a,b)=>b.pts-a.pts||b.wins-a.wins);}

function showArchive(year){const h=state.history.find(x=>x.year===year);if(!h)return;showModal(`<div class="eyebrow">PALMARÈS ${h.label}</div><h2>🏆 ${h.events} épreuves</h2><div class="tablewrap"><table class="table"><thead><tr><th>ÉPREUVE</th><th>POS.</th><th>STATUT</th></tr></thead><tbody>${h.personal.map(r=>`<tr><td>${esc(r.name)} ${r.sex?'· '+(r.type==='mixed'||r.type==='single'?'Mixte':sportLabel(r.sex)):''}</td><td>${r.rank}e</td><td>${r.olympic?'🥇 JO':'🏆 CDM'}</td></tr>`).join('')}</tbody></table></div><div class="actions"><button class="action alt" id="closeArchive">FERMER</button></div>`,'results-modal');$('closeArchive').onclick=hideModal;}
function confirmReset(){showModal(`<h2>⚠ Effacer la carrière entière ?</h2><p class="small">Cela effacera tous les résultats des saisons, le palmarès olympique, les jeunes recrutés et les anciens athlètes. La sauvegarde V2 reprise dans la V3 sera également perdue.</p><div class="actions"><button class="action warn" id="yesReset">OUI, TOUT RECOMMENCER</button><button class="action alt" id="noReset">ANNULER</button></div>`);$('yesReset').onclick=()=>{ROSTER=initialRoster();Object.assign(state,{year:2026,stage:0,results:[],history:[],retired:[],news:[],nextRookie:0,relaySelections:{},athleteId:`${state.sex}${state.nation}_0`});CALENDAR=makeCalendar(2026);save();hideModal();state.tab='home';menuRender()};$('noReset').onclick=hideModal;}
function composeModal(type,sex,onDone=null){const sexes=legSexes(type,sex),current=lineupFor(state.nation,type,sex),max=type==='single'?2:4;const labels=type==='relay'?`Relais ${sportLabel(sex).toLowerCase()}`:type==='mixed'?'Relais mixte · H-H-F-F':'Relais mixte simple · F-H-F-H';
showModal(`<div class="eyebrow">COMPOSITION D'ÉQUIPE · ${esc(nation(state.nation)[2])}</div><h2>👥 ${labels}</h2><p class="small">Choisis ${max} titulaires différents et leur ordre de passage. Leurs capacités de ski, de tir et leur âge sont pris en compte. ${type==='single'?'Les mêmes deux biathlètes courent deux fois chacun.':''}</p><div class="lineup-grid">${sexes.slice(0,max).map((s,i)=>`<div class="lineup-field"><label>RELÈVE ${i+1} · ${sportLabel(s)}</label><select data-lineup-slot="${i}">${rosterByNation(state.nation,s).map(a=>`<option value="${a.id}" ${a.id===current[i]?.id?'selected':''}>${esc(a.name)} (${a.age} ans) • Ski ${a.ski} / Tir ${a.shoot}</option>`).join('')}</select></div>`).join('')}</div><div class="banner" id="lineupError" style="display:none;color:#ffd1d8;border-color:#ff8390">Choisis des athlètes différents pour chaque passage.</div><div class="actions"><button class="action" id="confirmLineup">VALIDER LA COMPOSITION</button><button class="action alt" id="cancelLineup">ANNULER</button></div>`,'lineup-modal');
$('cancelLineup').onclick=hideModal;$('confirmLineup').onclick=()=>{const ids=[...document.querySelectorAll('[data-lineup-slot]')].map(x=>x.value);if(!saveLineup(type,sex,ids)){$('lineupError').style.display='block';return;}hideModal();if(onDone)onDone();else menuRender();};}

function simShot(ath,stance,relay){let misses=0,spent=0;const prob=clamp((stance==='P'?.84:.77)+(ath.shoot-77)*.0045,.55,.99);for(let i=0;i<5;i++)if(Math.random()>prob)misses++;if(relay){for(let k=0;k<3&&misses;k++){spent++;if(Math.random()<prob)misses--;}}return {misses,spent};}
function simSolo(a,type,def,start=0){const ks=def.total/1000,sp=clamp(6.45+(a.ski-80)*.041+(a.endurance-80)*.011,4.7,8.5);let total=def.total/sp+start,misses=0,stats=[];for(const stance of def.shotTypes){const s=simShot(a,stance,false);stats.push(s.misses);misses+=s.misses;total+=rand(30,43)+(def.timePenalty?s.misses*def.timePenalty:s.misses*def.penalty/6.3);}total+=rand(-30,45);return {time:Math.round(total),misses,shoots:stats.join('-')};}

 for(let i=0;i<22;i++){const angle=i/22*Math.PI*2,x=cx+(rx+21)*Math.cos(angle),y=cy+(ry+16)*Math.sin(angle);
  line(x,y,x,y-12,'#32556b',2);if(i%2===0)path([[x,y-12],[x+12,y-9],[x,y-5]],'#d94b59');}
 const traveled=(r.penaltyTotal-r.penaltyLeft),a=traveled/loop*Math.PI*2-Math.PI*.5;
 const sx=cx+(rx-10)*Math.cos(a),sy=cy+(ry-10)*Math.sin(a);
 // Quelques rivaux peuvent effectuer simultanément une boucle de pénalité.
 r.objects.filter(o=>o!==r.p&&o.penaltyRemaining>0).slice(0,5).forEach((o,j)=>{
  const phase=(o.penaltyTotal-o.penaltyRemaining)/loop*Math.PI*2-Math.PI*.5+j*.27;
  skier(cx+(rx-11-j*3)*Math.cos(phase),cy+(ry-9-j*2)*Math.sin(phase),.32,nation(o.n)[3],clock*6+j);
 });
 skier(sx,sy,clamp(H/630,.48,.9),nation(r.p.n)[3],clock*11);
 roundRect(W*.5-190,H*.095,380,51,10,'#173b55ea','#93d3da');
 txt(`BOUCLE DE PÉNALITÉ • ${loop} m`,W*.5,H*.134,19,'#fff','center');
 txt(`TOUR ${Math.min(r.penaltyLapsTotal,r.penaltyLapsDone+1)} / ${r.penaltyLapsTotal}   ·   ${Math.ceil(r.penaltyLeft)} m RESTANTS`,W*.5,H*.196,13,'#f9dca8','center');
 roundRect(W*.30,H*.90,W*.40,9,4,'#1c4a5dbb');roundRect(W*.30,H*.90,W*.40*(1-r.penaltyLeft/r.penaltyTotal),9,4,'#c5f67d');
}
function drawScope(){
 const s=race.shoot;if(!s)return;
 rect(0,0,W,H,gradient(0,H,'#648ba8','#e1f1f3'));
 drawMountainLayer(H*.36,H*.18,'#678ca7','#e2edf1');
 drawMountainLayer(H*.42,H*.11,'#a2bcc7','#f4faf8');
 rect(0,H*.39,W,H*.61,gradient(H*.39,H,'#e7f6f6','#b6d3db'));
 // Sapins lointains de chaque côté du stand de tir.
 for(let i=0;i<9;i++){
  const x=i*W/8,y=H*.47+12*Math.sin(i*2.3);
  pine(x,y,35+10*(i%3),.45);
 }
 // Auvent du stand et supports en perspective.
 rect(0,H*.235,W,H*.095,'#173d56');
 path([[0,H*.23],[W,H*.23],[W,H*.265],[0,H*.26]],'#225c74');
 line(0,H*.336,W,H*.336,'#7599ab',4);
 for(let i=0;i<12;i++){
  const x=i*W/11;
  rect(x-3,H*.235,6,H*.185,'#26485d');
  rect(x-1.5,H*.162,3,H*.072,'#d8e8eb');
 }
 const l=shootLayout();
 // Une plaque de cible avec relief métallique et contours peints.
 roundRect(l.first-l.space*.51-4,l.y-l.r*2.4,5*l.space+12,l.r*4.8,11,'#7894a3','#476274');
 roundRect(l.first-l.space*.51,l.y-l.r*2.33,5*l.space+5,l.r*4.65,9,'#d6e2e4','#a7b6bd');
 for(let i=0;i<5;i++){
  const x=l.first+i*l.space;
  ellipse(x,l.y+2,l.r+5,l.r+5,'#839ca7');
  ellipse(x,l.y,l.r+3,l.r+3,'#f8fcfa');
  ellipse(x,l.y,l.r+.65,l.r+.65,'#313f4b');
  ellipse(x,l.y,l.r*.83,l.r*.83,s.hit[i]?'#ecf7ef':'#0c1925');
  if(s.hit[i])ellipse(x-l.r*.16,l.y-l.r*.20,l.r*.18,l.r*.13,'#ffffffc7');
  if(i===s.active&&!s.hit[i]){
   ctx.strokeStyle='#c9f367';ctx.lineWidth=2;ctx.setLineDash([4,3]);
   ctx.beginPath();ctx.arc(x,l.y,l.r+10,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  }
 }
 // Couloirs de tir, tapis, marquages, numéros et neige tassée.
 for(let i=0;i<5;i++){
  const x=l.first+i*l.space;
  path([[x-21,H*.67],[x-46,H],[x+46,H],[x+21,H*.67]],i%2?'#cddfe2ab':'#d9ebecad');
  path([[x-24,H*.81],[x-36,H*.98],[x+36,H*.98],[x+24,H*.81]],'#466a78b7');
  line(x-21,H*.67,x-48,H,'#a3bdc5',1.6);
  line(x+21,H*.67,x+48,H,'#a3bdc5',1.6);
  roundRect(x-17,H*.62,34,21,4,'#e9f1f3','#688799');
  txt(String(i+1).padStart(2,'0'),x,H*.646,13,'#234e64','center');
 }
 // Présence du joueur, fusil posé / à l'épaule selon la position de tir.
 if(s.stance==='P'){
  ellipse(W*.28,H*.90,45,12,'#456a7682');
  path([[W*.13,H],[W*.19,H*.83],[W*.30,H*.77],[W*.45,H*.85],[W*.47,H]],'#2b5973');
  ellipse(W*.27,H*.81,17,12,'#274457');
  line(W*.28,H*.795,W*.61,H*.64,'#2d3941',11);
  line(W*.47,H*.71,W*.68,H*.64,'#8c8e8b',3);
 }else{
  ellipse(W*.24,H*.97,40,9,'#51778c77');
  path([[W*.19,H],[W*.21,H*.76],[W*.235,H*.73],[W*.275,H*.78],[W*.29,H]],'#2c5874');
  ellipse(W*.24,H*.71,17,18,'#25435a');
  line(W*.25,H*.715,W*.59,H*.595,'#263c49',11);
  line(W*.48,H*.625,W*.67,H*.604,'#82919a',3);
 }
 // Réticule de visée : décalé par la respiration et le vent.
 const aim=s.aim,wob=shotSway(s),actualX=aim.x+wob.x,actualY=aim.y+wob.y;
 ctx.strokeStyle='#eb434e';ctx.lineWidth=2.25;
 ctx.beginPath();ctx.arc(actualX,actualY,Math.max(16,l.r*1.13),0,Math.PI*2);
 ctx.moveTo(actualX-33,actualY);ctx.lineTo(actualX-8,actualY);
 ctx.moveTo(actualX+8,actualY);ctx.lineTo(actualX+33,actualY);
 ctx.moveTo(actualX,actualY-33);ctx.lineTo(actualX,actualY-8);
 ctx.moveTo(actualX,actualY+8);ctx.lineTo(actualX,actualY+33);ctx.stroke();
 ellipse(actualX,actualY,2.2,2.2,'#fff');
 if(s.feedback>0&&s.shotX!==null){
  ellipse(s.shotX,s.shotY,4,4,'#e95c42');
  ctx.strokeStyle='#ffd79b';ctx.lineWidth=1.8;
  ctx.beginPath();ctx.arc(s.shotX,s.shotY,7+s.feedback*15,0,Math.PI*2);ctx.stroke();
 }
 const bw=Math.min(224,W*.27),bx=W*.5-bw*.5,by=H*.70;
 roundRect(bx,by,bw,9,5,'#16364ba9');
 roundRect(bx,by,bw*(s.breathLeft/100),9,5,s.breathLeft<25?'#f8a85f':'#92e9c6');
 txt(`SOUFFLE ${Math.round(s.breathLeft)}%`,W/2,by+23,11,'#1e4055','center');
 if(s.exhausted)txt('SOUFFLE ÉPUISÉ !',W/2,by-18,13,'#aa2c2e','center');
 const wx=clamp(s.wind/3,-1,1)*42,wy=H*.16;
 roundRect(W*.5-83,wy-28,166,37,9,'#14354ed6','#6c9aaf');
 line(W*.5-43,wy-6,W*.5+43,wy-6,'#d4eff2',2);
 path([[W*.5+wx,wy-12],[W*.5+wx+Math.sign(wx||1)*11,wy-6],[W*.5+wx,wy]],'#daf8f5');
 txt(`${s.wind>=0?'VENT →':'VENT ←'} ${Math.abs(s.wind).toFixed(1)} m/s`,W*.5,wy-22,11,'#efffff','center');
}
function render(){if(!race)return;ctx.save();ctx.clearRect(0,0,W,H);if(race.mode==='shoot')drawScope();else if(race.mode==='penalty')drawPenaltyScene();else if(race.mode==='rangeEntry'||race.mode==='rangeExit')drawRangeTransition();else drawSki();ctx.restore()}
function tick(now){requestAnimationFrame(tick);let dt=clamp((now-timePrev)/1000,0,.06);timePrev=now;if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('toast').classList.add('hidden')}if(!race)return;
if(!race.paused&&!race.finished){let sim=dt*(race.mode==='shoot'?3.5:9.2);race.elapsed+=sim;race.wind=clamp(race.wind+Math.sin(now/10000)*dt*.007,-3,3);for(const a of race.objects)if(a!==race.p)updateAI(a,sim,race.elapsed);
if(['ski','penalty','rangeEntry','rangeExit'].includes(race.mode))playerSki(dt);else if(race.mode==='shoot'){const s=race.shoot;if(s){s.cooldown=Math.max(0,s.cooldown-dt);s.feedback=Math.max(0,s.feedback-dt);if(held.breath&&s.breathLeft>0){s.hold=true;s.breathLeft=Math.max(0,s.breathLeft-dt*21);s.exhausted=s.breathLeft<=0}else{s.hold=false;s.breathLeft=clamp(s.breathLeft+dt*11,0,100);if(s.breathLeft>35)s.exhausted=false}race.heartbeat=mix(race.heartbeat,held.breath?race.heartbeat+3:111,dt*.13);race.fatigue=clamp(race.fatigue-dt*.09,0,95);}}
race.flash=Math.max(0,race.flash-dt);updateHUD();}render()}
function pointerXY(ev){const rect=cv.getBoundingClientRect();return {x:ev.clientX-rect.left,y:ev.clientY-rect.top}}
let aiming=false;cv.addEventListener('pointerdown',e=>{if(!race||race.paused||race.mode!=='shoot')return;e.preventDefault();aiming=true;cv.setPointerCapture(e.pointerId);const p=pointerXY(e);race.shoot.aim={x:clamp(p.x,22,W-22),y:clamp(p.y,84,H*.79)};let l=shootLayout();let i=Math.round((p.x-l.first)/l.space);if(i>=0&&i<5&& !race.shoot.hit[i]&&(race.shoot.attempt>=5||i===race.shoot.attempt))race.shoot.active=i;});
cv.addEventListener('pointermove',e=>{if(!race||race.paused||race.mode!=='shoot'||!aiming)return;const p=pointerXY(e);race.shoot.aim={x:clamp(p.x,22,W-22),y:clamp(p.y,84,H*.78)}});
cv.addEventListener('pointerup',()=>{aiming=false});cv.addEventListener('pointercancel',()=>{aiming=false});
function holdButton(id,key){const b=$(id);const release=()=>{held[key]=false;b.classList.remove('pressed')};b.addEventListener('pointerdown',e=>{e.preventDefault();held[key]=true;b.classList.add('pressed');try{b.setPointerCapture(e.pointerId)}catch(e){}});for(const name of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(name,release)}
function tapButton(id,side){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();pushFoot(side);b.classList.add('pressed')});for(const name of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(name,()=>b.classList.remove('pressed'))}
tapButton('leftButton','L');tapButton('rightButton','R');holdButton('attackButton','attack');holdButton('recoverButton','recover');holdButton('breathButton','breath');$('fireButton').addEventListener('pointerdown',e=>{e.preventDefault();fire()});$('reloadButton').addEventListener('pointerdown',e=>{e.preventDefault();reload()});$('pauseButton').onclick=pause;
const keys={};window.addEventListener('keydown',e=>{if(e.repeat)return;if(!race||race.paused)return;const k=e.key.toLowerCase();if(['a','q','arrowleft'].includes(k))pushFoot('L');if(['d','arrowright'].includes(k))pushFoot('R');if(k===' '){held.attack=true;e.preventDefault()}if(k==='r')held.recover=true;if(k==='b')held.breath=true;if(k==='enter'){e.preventDefault();if(race.mode==='shoot')fire()}if(k==='x'&&race.mode==='shoot')reload();if(k==='escape')pause()});window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k===' ')held.attack=false;if(k==='r')held.recover=false;if(k==='b')held.breath=false});window.addEventListener('blur',()=>{held.attack=held.recover=held.breath=false});
window.addEventListener('contextmenu',e=>{if(state.screen==='game')e.preventDefault()});document.addEventListener('touchmove',e=>{if(state.screen==='game'&&!e.target.closest('#modalRoot, #menu'))e.preventDefault()},{passive:false});
state.screen='menu';resize();menuRender();requestAnimationFrame(tick);
})();
